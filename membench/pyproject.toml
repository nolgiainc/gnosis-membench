[project]
name = "membench"
version = "0.1.0"
description = "Memory-quality benchmark harness for gnosis (LongMemEval + LOCOMO)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "nltk>=3.9",
]

[project.scripts]
membench = "membench.run:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/membench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501 exempted for verbatim benchmark prompt strings and test fixture literals.
[tool.ruff.lint.per-file-ignores]
"src/membench/grade.py" = ["E501"]
"src/membench/answer.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
